name: build-dsh-ios

on:
  workflow_dispatch:
  push:
    branches: [ local-app ]

permissions:
  contents: write

jobs:
  rootfs:
    runs-on: ubuntu-latest
    container: alpine:edge
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: apk add --no-cache bash tar xz coreutils nodejs npm
      - name: build rootfs
        run: |
          mkdir -p /out
          sh rootfs/build-rootfs.sh
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-rootfs
          path: /out/root.tar.gz
          if-no-files-found: error

  app:
    needs: rootfs
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dsh-rootfs
          path: rootfs

      - name: clone iSH
        run: |
          git clone --recursive --shallow-submodules --depth 1 https://github.com/ish-app/ish ish
          ls ish/deps

      - name: patch rootfs source
        run: python3 patch_ish.py ish

      - name: build
        run: |
          set -o pipefail
          xcodebuild -project ish/iSH.xcodeproj \
            -scheme iSH \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ROOTFS_SRC="$PWD/rootfs/root.tar.gz" \
            PRODUCT_BUNDLE_IDENTIFIER=com.dshgo.local \
            | xcpretty || xcodebuild -project ish/iSH.xcodeproj -scheme iSH -configuration Release -sdk iphoneos -arch arm64 -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO ROOTFS_SRC="$PWD/rootfs/root.tar.gz" PRODUCT_BUNDLE_IDENTIFIER=com.dshgo.local

      - name: package ipa
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "APP=$APP"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName DSH Go" "$APP/Info.plist" || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier com.dshgo.local" "$APP/Info.plist" || true
          ls -lh "$APP/root.tar.gz" || echo "NO ROOTFS IN BUNDLE"
          mkdir -p Payload && cp -R "$APP" Payload/
          /usr/bin/codesign --force --sign - Payload/*.app || true
          zip -qry DSHGo-iOS.ipa Payload
          ls -lh DSHGo-iOS.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: DSHGo-iOS-ipa
          path: DSHGo-iOS.ipa
          if-no-files-found: error

      - name: Publish release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f DSHGo-iOS.ipa ]; then
            tag="local-$(date -u +%Y%m%d-%H%M%S)"
            gh release create "$tag" DSHGo-iOS.ipa --title "DSH Go iOS $tag" --notes "未签名 IPA：iSH 内核 + 内置 Alpine/Node24/dsh" --repo "$GITHUB_REPOSITORY" || true
          fi
